# Contribution snake.
#
# The SVGs are published to the `output` branch, NOT to main. GitHub's contribution
# graph only counts commits on the default branch, so a daily automated commit on main
# paints a green square every day and makes the graph look scripted. The branch holds a
# single bot commit (force-pushed each run) that carries every generated image, the
# metrics SVGs included.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake-${{ github.repository }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate SVGs from contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Hex colors live in a query string, so "#" MUST be percent-encoded as %23.
          # Bare hex produced `--cs:E8A317` (invalid CSS) and the whole grid rendered blank.
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%230D1117&color_dots=%23EBEDF0,%239BE9A8,%2330C463,%2330C463,%23216E39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23E8A317&color_dots=%23161B22,%230E4429,%23006D32,%2326A641,%2339D353

      # Publish as github-actions[bot] to the `output` branch. Files already on that
      # branch (the metrics SVGs) are carried over, then the branch is replaced by one commit.
      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir publish
          cd publish
          git init -q -b output
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin output; then
            git checkout -q FETCH_HEAD -- .
          fi
          cp ../dist/*.svg .
          git add -A
          git commit -q -m "chore: update contribution snake"
          git push -q --force origin output
