# Self-hosted profile metrics.
#
# Why: the public github-readme-stats instance returns 503 (over quota) and
# github-profile-trophy returns 402 (billing). Both render as broken images on
# the profile. This workflow generates the SVGs inside our own Actions run and
# commits them to the `output` branch (never main: only default-branch commits count
# toward the contribution graph, and a daily bot commit there looks scripted).
# The branch is created by the snake workflow; run that one first.
#
# Requires secret METRICS_TOKEN: a classic personal access token with the
# `read:user` scope ONLY. It reads public data, so the language chart covers
# public repositories and the calendar counts private contributions once you
# enable Settings -> Profile -> "Include private contributions on my profile".
# Do not give it `repo` scope: that would hand read/write access to every
# private repository to a third-party action on every run.
#
# Without the secret the job skips cleanly and warns, instead of failing daily.
# Set it with:  gh secret set METRICS_TOKEN --repo Zsadigzade/Zsadigzade
#
# The action is pinned to a commit SHA (tag v3.34). Bump it deliberately.

name: Generate profile metrics

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics-${{ github.repository }}
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check METRICS_TOKEN
        id: token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::METRICS_TOKEN secret is not set, skipping metrics. See the header of this workflow."
          fi

      # Languages across public repos (the token has no private access by design).
      - name: Languages
        if: steps.token.outputs.present == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Zsadigzade
          filename: metrics-languages.svg
          base: ""
          config_timezone: Europe/Prague
          config_display: large
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_ignored: html, css, scss, tex, jupyter notebook, makefile, dockerfile
          plugin_languages_threshold: 1%
          output_action: commit
          committer_branch: output
          committer_message: "chore: update language metrics"

      # Full-year contribution calendar + current/longest streak.
      - name: Calendar
        if: steps.token.outputs.present == 'true'
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Zsadigzade
          filename: metrics-calendar.svg
          base: ""
          config_timezone: Europe/Prague
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          committer_branch: output
          committer_message: "chore: update calendar metrics"
